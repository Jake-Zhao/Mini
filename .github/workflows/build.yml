name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test --package-path Core
      - name: Python
        run: python3 -m pip install -r tools/requirements.txt
      - name: Source asset status
        run: |
          if [ -f Source/Vehicle/car_master.png ] && [ -f Reference/APPROVED.png ]; then
            echo "Full binary art sources present."
          else
            echo "Binary art masters are distributed in JAKE_DRIVE_CINEMATIC_FINAL.zip; core CI will continue without pretending asset compilation passed."
          fi
      - name: Build runtime assets when masters are present
        run: |
          if [ -f Source/Vehicle/car_master.png ] && [ -f Reference/APPROVED.png ]; then
            python3 tools/build_assets.py
          else
            echo "SKIP: source art masters not present in connector-populated Git tree."
          fi
      - name: Regenerate project
        run: python3 tools/make_project.py
      - name: Xcode build
        run: xcodebuild -project JakeDriveMetal.xcodeproj -scheme JakeDriveMetal -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
